[project]
name = "iacrisk"
version = "0.1.0"
description = "Risk-aware prioritization layer for IaC security misconfiguration findings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iacrisk"]

# The uv cache and this repo sit on different filesystems, so hardlinking fails and
# uv warns on every `uv run`. Acceptance gate item 2 requires CLAUDE.md commands to
# carry observed output, and that transcript is dissertation evidence - keep it free
# of environment noise.
[tool.uv]
link-mode = "copy"

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools", "eval"]
# ruff formats Python code blocks inside Markdown. *.md holds the plan and spec of
# record - citable research artifacts whose code blocks specify what to write, not
# source to be restyled - plus CLAUDE.md's command blocks. corpus/vendor holds
# subtree copies pinned to upstream commit SHAs (spec §4.6); reformatting them would
# silently break the recorded-SHA claim. corpus/pairs and corpus/scenarios are
# first-party and stay governed. Must be extend-exclude: --exclude/exclude replaces
# ruff's defaults and pulls in ignored directories.
extend-exclude = ["*.md", "corpus/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tools", "eval", "tests"]
# `files` names `tools`, and `tools/` holds two directories that are not this
# project's code: `tools/bin/` (checksum-verified release binaries) and
# `tools/cache/` (182.8 MB of pinned archives and upstream clones). Both are
# git-ignored. The cache clone of kubernetes-goat carries two third-party
# `app.py` files whose module names collide, and mypy answers a duplicate module
# with `errors prevented further checking` - it aborts having checked *nothing*.
# Measured: without this exclude, bare `uv run mypy` exits 2 and checks 0 files
# while `strict = true` believes it is checking everything.
exclude = "^tools/(bin|cache)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-rs` lives here rather than on the command line so the gate is bare. `addopts`
# already carries `-q`; a second `-q` from the command line reaches verbosity -2,
# at which pytest drops the `N passed, M skipped` line entirely. A gate with
# flags to retype is a gate with a way to get it wrong.
addopts = "-q --strict-markers -rs"
pythonpath = ["src", "."]
